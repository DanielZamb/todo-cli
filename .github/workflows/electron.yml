name: Unsigned Electron build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Toolchain: macOS 26 arm64, Xcode 26.6, Node.js 22.23.4, pnpm 10.30.1,
# Bun 1.4.4. Xcode compiles Electron's icon; CLI and SwiftUI stay build-from-source.
# Runner tools: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
# Local reproduction from a clean checkout with this toolchain selected:
#   sh scripts/disk-guard.sh && pnpm install --frozen-lockfile && \
#     sh scripts/disk-guard.sh && \
#     /usr/bin/lockf -k /tmp/todo-own-work-electron.lock pnpm --filter @todo/electron build
# Clean-export proof after installing dependencies in the calling checkout:
#   TODO_VERIFY_ELECTRON_PACKAGE=1 pnpm --filter @todo/electron test test/package-build.test.ts
# That proof exports HEAD, installs into isolated caches, builds under the lock,
# and inspects Todo.app without launching it. Its printed scratch path holds logs.

jobs:
  electron:
    name: Build unsigned Electron app
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TODO_ELECTRON_VERIFY_HOST: "0"
    steps:
      - name: Clean checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: "10.30.1"
          run_install: false
      - name: Set up Bun runtime
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: |
          sh scripts/disk-guard.sh
          pnpm install --frozen-lockfile
      - name: Build unsigned app
        run: |
          sh scripts/disk-guard.sh
          /usr/bin/lockf -k /tmp/todo-own-work-electron.lock pnpm --filter @todo/electron build
      - name: Inspect package without launching
        run: |
          bundle=apps/electron/dist/Todo.app/Contents
          test -x "$bundle/MacOS/Electron"
          test -s "$bundle/Resources/Assets.car"
          test -s "$bundle/Resources/app/dist/main.cjs"
          test -s "$bundle/Resources/app/dist/preload.cjs"
          test -s "$bundle/Resources/app/dist/renderer/index.html"
          test -s "$bundle/Resources/app/THIRD_PARTY_NOTICES.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")" = dev.todo.electron
